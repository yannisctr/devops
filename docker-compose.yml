services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [todo]
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME:-todo}
      DB_USER: ${DB_USER:-todo}
      DB_PASSWORD: ${DB_PASSWORD:-dev-todo}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1/api/health]
      interval: 5s
      timeout: 4s
      retries: 15
    networks: [todo]
  database:
    build: ./database
    environment:
      MYSQL_DATABASE: ${DB_NAME:-todo}
      MYSQL_USER: ${DB_USER:-todo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev-todo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT id FROM tasks LIMIT 1"']
      interval: 5s
      timeout: 4s
      retries: 25
    networks: [todo]
networks:
  todo:
volumes:
  mysql-data:
