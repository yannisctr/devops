server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
