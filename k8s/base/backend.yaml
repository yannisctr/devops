apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: tp-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: service
              containerPort: 80
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: todo-config, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: todo-config, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                configMapKeyRef: { name: todo-config, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: todo-db, key: password }
          readinessProbe:
            httpGet: { path: /api/health, port: service }
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: { path: /api/live, port: service }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /api/live, port: service }
            periodSeconds: 5
            failureThreshold: 36
