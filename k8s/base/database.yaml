apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    app: database
  ports:
    - port: 3306
      targetPort: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: database
          image: tp-database
          imagePullPolicy: IfNotPresent
          ports:
            - name: service
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: { name: todo-config, key: DB_NAME }
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: { name: todo-config, key: DB_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: todo-db, key: password }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: todo-db, key: root-password }
          readinessProbe:
            exec:
              command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -Nse "SELECT id FROM tasks LIMIT 1"']
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            tcpSocket: { port: service }
            periodSeconds: 10
          startupProbe:
            tcpSocket: { port: service }
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
