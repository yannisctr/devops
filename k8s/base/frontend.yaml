apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: tp-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: service
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: service }
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: { path: /healthz, port: service }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: service }
            periodSeconds: 5
            failureThreshold: 36
